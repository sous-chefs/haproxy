---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.0
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write
    secrets: inherit

  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os:
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - amazonlinux-2023
          - centos-stream-9
          - centos-stream-10
          - debian-11
          - debian-12
          - debian-13
          - fedora-latest
          - opensuse-leap-15
          - oraclelinux-8
          - oraclelinux-9
          - rockylinux-8
          - rockylinux-9
          - rockylinux-10
          - ubuntu-2204
          - ubuntu-2404
        suite:
          - default
          - package
          - source-32
          - source-default
          - source-lua
          - source-openssl
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.0
      - name: Dokken
        uses: actionshub/test-kitchen@main
        env:
          CHEF_LICENSE: accept-no-persist
          CHEF_VERSION: latest
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          KITCHEN_PRODUCT_NAME: cinc
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}

  config-test:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os:
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - amazonlinux-2023
          - centos-stream-9
          - centos-stream-10
          - debian-11
          - debian-12
          - debian-13
          - fedora-latest
          - opensuse-leap-15
          - oraclelinux-8
          - oraclelinux-9
          - rockylinux-8
          - rockylinux-9
          - rockylinux-10
          - ubuntu-2204
          - ubuntu-2404
        suite:
          - config-2
          - config-3
          - config-acl
          - config-array
          - config-backend-search
          - config-custom-template
          - config-fastcgi
          - config-resolver
          - config-ssl-redirect
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.0
      - name: Dokken
        uses: actionshub/test-kitchen@main
        env:
          CHEF_LICENSE: accept-no-persist
          CHEF_VERSION: latest
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          KITCHEN_PRODUCT_NAME: cinc
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}

  final:
    if: always()
    needs: [integration, config-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check integration results
        env:
          CONFIG_RESULT: ${{ needs.config-test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$CONFIG_RESULT" = success
          test "$INTEGRATION_RESULT" = success
