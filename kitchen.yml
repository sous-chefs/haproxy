---
driver:
  name: vagrant

provisioner:
  name: policyfile_zero
  product_name: cinc
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true
  chef_license: accept
  policyfile: Policyfile.rb

verifier:
  name: inspec

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: centos-stream-10
  - name: debian-11
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: opensuse-leap-15
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: rockylinux-10
  - name: ubuntu-22.04
  - name: ubuntu-24.04

suites:
  - name: default
    provisioner:
      named_run_list: default
  - name: package
    provisioner:
      named_run_list: package
  - name: source_3.2
    provisioner:
      named_run_list: source_32
  - name: source-default
    provisioner:
      named_run_list: source
  - name: source_lua
    provisioner:
      named_run_list: source_lua
  - name: source_openssl
    provisioner:
      named_run_list: source_openssl
  - name: config_2
    provisioner:
      named_run_list: config_2
  - name: config_3
    provisioner:
      named_run_list: config_3
  - name: config_backend_search
    provisioner:
      named_run_list: config_backend_search
  - name: config_acl
    provisioner:
      named_run_list: config_acl
  - name: config_resolver
    provisioner:
      named_run_list: config_resolver
  - name: config_ssl_redirect
    provisioner:
      named_run_list: config_ssl_redirect
  - name: config_custom_template
    provisioner:
      named_run_list: config_custom_template
  - name: config_array
    provisioner:
      named_run_list: config_array
  - name: config_fastcgi
    provisioner:
      named_run_list: config_fastcgi
