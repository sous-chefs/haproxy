---
driver:
  name: vagrant

provisioner:
  name: policyfile_zero
  deprecations_as_errors: true
  chef_license: accept
  product_name: chef
  product_version: <%= ENV['CHEF_VERSION'] || 'latest' %>
  install_strategy: always
  log_level: <%= ENV['CHEF_LOG_LEVEL'] || 'auto' %>
  policyfile: Policyfile.rb

verifier:
  name: inspec

platforms:
  - name: amazonlinux-2023
  - name: centos-stream-8
  - name: centos-stream-9
  - name: debian-11
  - name: debian-12
  - name: ubuntu-20.04
  - name: ubuntu-22.04
  - name: fedora-latest

suites:
  - name: default
    provisioner:
      named_run_list: default
  - name: package
    provisioner:
      named_run_list: package
  - name: source_2.8
    provisioner:
      named_run_list: source_28
  - name: source_default
    provisioner:
      named_run_list: source
  - name: source_lua
    provisioner:
      named_run_list: source_lua
  - name: source_openssl
    provisioner:
      named_run_list: source_openssl
    verifier:
      inspec_tests:
        - path: test/integration/source_openssl
  - name: config_2
    provisioner:
      named_run_list: config_2
  - name: config_3
    provisioner:
      named_run_list: config_3
  - name: config_4
    provisioner:
      named_run_list: config_4
  - name: config_backend_search
    provisioner:
      named_run_list: config_backend_search
  - name: config_acl
    provisioner:
      named_run_list: config_acl
  - name: config_resolver
    provisioner:
      named_run_list: config_resolver
  - name: config_ssl_redirect
    provisioner:
      named_run_list: config_ssl_redirect
  - name: config_custom_template
    provisioner:
      named_run_list: config_custom_template
  - name: config_array
    provisioner:
      named_run_list: config_array
  - name: config_fastcgi
    provisioner:
      named_run_list: config_fastcgi
